<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="BOCHA Workspace — Minimalist &amp; Premium AI-Native Productivity Platform" />
    <title>BOCHA Workspace</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='roseGrad' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' stop-color='%23C17767'/%3E%3Cstop offset='100%25' stop-color='%239E4D3E'/%3E%3C/linearGradient%3E%3ClinearGradient id='bgGrad' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' stop-color='%232A1B14'/%3E%3Cstop offset='100%25' stop-color='%23190F0B'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='18' fill='url(%23bgGrad)'/%3E%3Crect x='1' y='1' width='62' height='62' rx='17' fill='none' stroke='%23C17767' stroke-opacity='0.3' stroke-width='1.5'/%3E%3Cpath fill='url(%23roseGrad)' fill-rule='evenodd' clip-rule='evenodd' d='M14 12c0-2.2 1.8-4 4-4h18c6.6 0 12 5.4 12 12 0 4-1.9 7.6-5 9.7 4.2 2.1 7 6.5 7 11.5 0 7.7-6.3 14-14 14H18c-2.2 0-4-1.8-4-4V12zm9 14h9c3.3 0 6-2.7 6-6s-2.7-6-6-6h-9v12zm0 20h10c4.4 0 8-3.6 8-8s-3.6-8-8-8H23v16z'/%3E%3Ccircle cx='43' cy='20' r='3' fill='%23F5F2EB'/%3E%3C/svg%3E" />
    <link rel="alternate icon" href="/favicon.svg" type="image/svg+xml" />
    <!-- Synchronous Anti-FOUC & Anti-Layout-Shift Bootstrap -->
    <script>
      (function() {
        var root = document.documentElement;

        // 1. Theme Bootstrap
        var THEME_STORAGE_VERSION = 1;
        var themeMode = 'system';

        try {
          var rawTheme = localStorage.getItem('lifeos-theme');
          if (rawTheme) {
            var themeEnvelope = JSON.parse(rawTheme);
            if (
              themeEnvelope &&
              typeof themeEnvelope === 'object' &&
              themeEnvelope.version === THEME_STORAGE_VERSION &&
              themeEnvelope.state &&
              typeof themeEnvelope.state === 'object'
            ) {
              var theme = themeEnvelope.state.theme;
              if (theme === 'light' || theme === 'dark' || theme === 'system') {
                themeMode = theme;
              }
            }
          }
        } catch (e) {
          themeMode = 'system';
        }

        var isDark = false;
        try {
          if (themeMode === 'system') {
            isDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          } else {
            isDark = themeMode === 'dark';
          }
        } catch (e) {
          isDark = false;
        }

        try {
          if (isDark) {
            root.classList.add('dark');
            root.style.colorScheme = 'dark';
          } else {
            root.classList.remove('dark');
            root.style.colorScheme = 'light';
          }
        } catch (e) {
          // Fallback if documentElement is not yet accessible
        }

        // 2. Locale & Direction Bootstrap
        var LOCALE_STORAGE_VERSION = 1;
        var locale = 'en';

        try {
          var rawLocale = localStorage.getItem('lifeos-locale');
          if (rawLocale) {
            var localeEnvelope = JSON.parse(rawLocale);
            if (
              localeEnvelope &&
              typeof localeEnvelope === 'object' &&
              localeEnvelope.version === LOCALE_STORAGE_VERSION &&
              localeEnvelope.state &&
              typeof localeEnvelope.state === 'object'
            ) {
              var loc = localeEnvelope.state.locale;
              if (loc === 'en' || loc === 'ar') {
                locale = loc;
              }
            }
          }
        } catch (e) {
          locale = 'en';
        }

        try {
          var isAr = locale === 'ar';
          root.lang = locale;
          root.dir = isAr ? 'rtl' : 'ltr';

          if (isAr) {
            root.classList.add('font-arabic');
            root.classList.remove('font-sans');
          } else {
            root.classList.add('font-sans');
            root.classList.remove('font-arabic');
          }
        } catch (e) {
          // Fallback if documentElement is not yet accessible
        }
      })();
    </script>
  </head>
  <body class="bg-background text-text-primary antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
